<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Roller</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;

            padding: 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            font-size: 42px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            font-size: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            outline: none;

            font-size: 18px;
            text-align: center;

            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #4f46e5;
            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.97);
        }

        #diceResult {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;

            margin-top: 30px;
        }

        .dice {
            width: 70px;
            height: 70px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;
            color: #333;

            border-radius: 15px;

            font-size: 30px;
            font-weight: bold;

            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);

            animation: roll 0.5s ease;
        }

        #total {
            margin-top: 25px;

            font-size: 25px;
            font-weight: bold;
        }

        /* ERROR FIX:
           You used animation: roll 0.5s ease
           but didn't define the animation.
        */
        @keyframes roll {
            0% {
                transform: rotate(0deg) scale(0.5);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎲 Dice Roller</h1>

        <p class="subtitle">
            Choose how many dice you want to roll
        </p>

        <form id="diceForm">

            <label for="diceCount">
                Number of Dice
            </label>

            <input type="number" id="diceCount" min="1" max="20" value="1">

            <button type="button" onclick="roll()">
                🎲 Roll Dice
            </button>

        </form>

        <p id="diceResult"></p>



    </div>


    <script>


        function roll() {
            let values = []
            const count = document.getElementById("diceCount");
            let value = Number(count.value);
            for (let i = 0; i < value; i++) {

                let result = Math.floor(Math.random() * 6) + 1;
                values.push(result);

            }
            diceResult.textContent = `dice ${values.join(', ')}`;
        }

    </script>

</body>

</html>

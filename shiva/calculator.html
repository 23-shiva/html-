<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>

    <style>
        body {
            background-color: #222;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 20px;
            width: 300px;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 35px;
            text-align: right;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 150px;
            background-color: #555;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background-color: #666;
        }

        .operator {
            background-color: orange;
        }

        .operator:hover {
            background-color: darkorange;
        }

        #clear {
            background-color: #aaa;
            color: black;
        }

        #equal {
            background-color: rgb(227, 162, 0);
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">


            <button class="operator" onclick="div(this)">÷</button>
            <button class="operator" onclick="multi(this)">x</button>
            <button class="operator" onclick="subs(this)">−</button>
            <button class="operator" onclick="add(this)">+</button>

            <button onclick="number(this)">1</button>
            <button onclick="number(this)">2</button>
            <button onclick="number(this)">3</button>
            <button onclick="number(this)">4</button>
            <button onclick="number(this)">5</button>
            <button onclick="number(this)">6</button>
            <button onclick="number(this)">7</button>
            <button onclick="number(this)">8</button>
            <button onclick="number(this)">9</button>
            <button onclick="number(this)" id="zero">0</button>
            <button id="clear" onclick="clears()">AC</button>
            <button id="equal" onclick="ans()">=</button>

        </div>

    </div>
    <script>
  
        function number(button) {
            const value = button.textContent;
            document.getElementById("display").value += value;

        }

        function div(button) {
        
            document.getElementById("display").value += "/";

        }


        function multi(button) {
          
            document.getElementById("display").value +=  "*";
        }
        function add(button) {
            const symbol = button.textContent;
            document.getElementById("display").value += symbol;
        }
        function sub(button) {
            const symbol = button.textContent;
            document.getElementById("display").value += symbol;
        }


        function ans() { 
            
            const display = document.getElementById("display");

    try {
        if (display.value === "") {
            throw new Error("Nothing entered");
        }

        display.value = eval(display.value);

    } catch (error) {
        window.alert("Enter a number brooo");
        display.value = "";
    }
        }

        function clears() {
            document.getElementById("display").value = "";
        }

    </script>
</body>

</html>

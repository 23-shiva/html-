<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #925bbe);
        }

        #container {
            width: 380px;
            padding: 30px;

            display: flex;
            flex-direction: column;
            gap: 15px;

            background-color: white;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 28px;
            color: #333;
        }

        #input {
            width: 100%;
            padding: 12px;

            font-size: 18px;

            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        #input:focus {
            border-color: #667eea;
        }

        label {
            padding: 12px;

            background-color: #f5f5f5;
            border-radius: 10px;

            cursor: pointer;
            transition: 0.2s;
        }

        label:hover {
            background-color: #e9e9ff;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        #submit {
            width: 100%;
            height: 45px;

            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        #submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        p {
            margin: 5px 0 0;
            text-align: center;

            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <form id="container">

        <h1>Temperature Conversion</h1>

        <input type="number"  id="input" value="0">

        <label>
            <input type="radio" name="unit" id="ctof">
            Celsius → Fahrenheit
        </label>

        <label>
            <input type="radio" name="unit" id="ftoc">
            Fahrenheit → Celsius
        </label>

        <button type="button" id="submit" onclick="showresult()">Convert</button>

        <p id="message">Please select a unit to convert</p>
        <p id="output"></p>

    </form>

    <script>

        let input = document.getElementById("input");
        const ctof = document.getElementById("ctof");
        const ftoc = document.getElementById("ftoc");

        let message = document.getElementById("message");
        let output = document.getElementById("output");


        function showresult() {

            let value = Number(input.value);

            if (ctof.checked) {

                let answer = (value * 9 / 5) + 32;

                output.textContent = answer + " °F";
                message.textContent = "";

            }

            else if (ftoc.checked) {

                let answer = (value - 32) * 5 / 9;

                output.textContent = answer + " °C";
                message.textContent = "";

            }

            else {

                message.textContent = "Please select a unit to convert";
                output.textContent = "";

            }
        }

    </script>

</body>

</html>
